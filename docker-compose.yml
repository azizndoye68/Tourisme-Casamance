version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourisme-casamance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourisme_casamance}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-tourisme_casamance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - tourisme-network

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: tourisme-casamance-strapi
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-tourisme_casamance}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_KEYS: ${APP_KEYS:-key1,key2,key3,key4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-api-token-salt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-admin-jwt-secret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-transfer-token-salt}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret}
      HOST: 0.0.0.0
      PORT: 1337
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./strapi:/app
      - /app/node_modules
      - /app/.tmp
      - /app/dist
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tourisme-network
    develop:
      watch:
        - action: sync
          path: ./strapi/src
          target: /app/src
        - action: sync
          path: ./strapi/package.json
          target: /app/package.json
        - action: rebuild
          path: ./strapi/package-lock.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourisme-casamance-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - strapi
    networks:
      - tourisme-network
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  postgres_data:

networks:
  tourisme-network:
    driver: bridge